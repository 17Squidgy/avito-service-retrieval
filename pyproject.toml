[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-service-retrieval"
version = "0.1.0"
description = "Reproducible hybrid candidate generation for Russian service search"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "scikit-learn", "tqdm", "snowballstemmer"]

[project.optional-dependencies]
dense = ["torch", "sentence-transformers"]
ranking = ["catboost"]

[tool.setuptools.packages.find]
where = ["src"]
